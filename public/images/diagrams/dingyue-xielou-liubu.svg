<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="订阅链接泄露后的六步处理：先止损、后台重置订阅、确认旧链接失效、所有设备换新链接、加固账号、异常消耗找客服"><title>订阅链接泄露后的六步处理：先止损、后台重置订阅、确认旧链接失效、所有设备换新链接、加固账号、异常消耗找客服</title><style>
  svg{--bg:#fbf6ea;--card:#fffdf6;--line:#17120d;--ink:#17120d;--sub:#5f5647;--acc:#b42d0c;--accs:#ffe1d8;--warn:#b42d0c;}
  @media (prefers-color-scheme: dark){svg{--bg:#12100d;--card:#1c1915;--line:#f6f0e2;--ink:#f6f0e2;--sub:#b3a995;--acc:#ff8a5c;--accs:#3a2418;--warn:#ff8a5c;}}
  text{font-family:-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif;fill:var(--ink)}
  .bg{fill:var(--bg)}
  .card{fill:var(--card);stroke:var(--line);stroke-width:2}
  .accbox{fill:var(--accs);stroke:var(--acc);stroke-width:2}
  .ttl{font-size:20px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15px}
  .s{font-size:13.5px;fill:var(--sub)}
  .acc{fill:var(--acc)}
  .warn{fill:var(--warn)}
  .ln{stroke:var(--acc);stroke-width:2.2;fill:none}
  .lnl{stroke:var(--line);stroke-width:2;fill:none}
  .num{font-size:15px;font-weight:700;fill:var(--acc)}
  </style><rect class="bg" width="960" height="356"/><text class="ttl" x="34" y="44">订阅链接泄露了怎么办：6 步处理</text><rect class="card" x="34" y="76" width="288" height="104" rx="0" /><text class="num" x="48" y="106" style="font-size:22px">1</text><text class="h" x="80" y="106">先止损</text><text class="s" x="50" y="138" text-anchor="start">删除暴露链接的截图、帖子、共享文档</text><rect class="accbox" x="338" y="76" width="288" height="104" rx="0" /><text class="num" x="352" y="106" style="font-size:22px">2</text><text class="h" x="384" y="106">后台重置订阅</text><text class="s" x="354" y="138" text-anchor="start">在机场面板里重置订阅链接</text><rect class="card" x="642" y="76" width="288" height="104" rx="0" /><text class="num" x="656" y="106" style="font-size:22px">3</text><text class="h" x="688" y="106">确认旧链接失效</text><text class="s" x="658" y="138" text-anchor="start">用旧链接更新一次，看是否失败</text><rect class="card" x="34" y="198" width="288" height="104" rx="0" /><text class="num" x="48" y="228" style="font-size:22px">4</text><text class="h" x="80" y="228">所有设备换新链接</text><text class="s" x="50" y="260" text-anchor="start">替换订阅并更新，删掉旧条目</text><rect class="card" x="338" y="198" width="288" height="104" rx="0" /><text class="num" x="352" y="228" style="font-size:22px">5</text><text class="h" x="384" y="228">加固账号</text><text class="s" x="354" y="260" text-anchor="start">改面板密码、开二次验证、看在线设备</text><rect class="card" x="642" y="198" width="288" height="104" rx="0" /><text class="num" x="656" y="228" style="font-size:22px">6</text><text class="h" x="688" y="228">异常消耗找客服</text><text class="s" x="658" y="260" text-anchor="start">说明时间点和用量，截图别露出链接</text><text class="s" x="34" y="332">重置订阅链接不等于重置流量；是否同时更换节点认证信息因面板而异，拿不准就直接问客服。</text></svg>